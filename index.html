<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tracit</title>
  <meta name="description" content="Trace reference images onto paper or canvas using your phone camera.">
  <meta name="theme-color" content="#111318">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/><path d="M19 2v6M16 5h6"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.5-2"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
      <symbol id="i-hide" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-show" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><path d="M3 3l18 18"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M9 6L3 18h6z"/><path d="M15 6l6 12h-6z"/></symbol>
      <symbol id="i-switch" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 12a3 3 0 015-2l1 1M15 14a3 3 0 01-5 2l-1-1"/><path d="M15 9v2h-2M9 17v-2h2"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
    </defs>
  </svg>

  <main id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
    <div id="touch"></div>
  </main>

  <!-- Top bar: tracking status + quick actions -->
  <header id="topbar" class="ui">
    <span id="status" class="badge" data-s="off">Camera</span>
    <span id="stats" hidden></span>
    <span class="spacer"></span>
    <button id="btn-cam" class="icon-btn" aria-label="Switch camera"><svg><use href="#i-switch"/></svg></button>
    <button id="btn-full" class="icon-btn" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
    <button id="btn-hide" class="icon-btn" aria-label="Hide controls"><svg><use href="#i-hide"/></svg></button>
  </header>

  <!-- Main toolbar -->
  <nav id="toolbar" class="ui">
    <button id="btn-capture" class="tool primary"><svg><use href="#i-camera"/></svg><span>Capture canvas</span></button>
    <button id="btn-add" class="tool"><svg><use href="#i-image"/></svg><span>Add image</span></button>
    <button id="btn-place" class="tool" data-needs="snapshot"><svg><use href="#i-move"/></svg><span>Place</span></button>
    <button id="btn-trace" class="tool" data-needs="snapshot"><svg><use href="#i-target"/></svg><span>Trace</span></button>
    <button id="btn-layers" class="tool"><svg><use href="#i-layers"/></svg><span>Layers</span></button>
    <button id="btn-grid" class="tool toggle"><svg><use href="#i-grid"/></svg><span>Grid</span></button>
    <button id="btn-lock" class="tool toggle"><svg><use href="#i-unlock"/></svg><span>Lock</span></button>
    <button id="btn-freeze" class="tool toggle"><svg><use href="#i-pause"/></svg><span>Freeze</span></button>
    <button id="btn-settings" class="tool"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
  </nav>

  <button id="btn-show" class="icon-btn floating" aria-label="Show controls" hidden><svg><use href="#i-show"/></svg></button>

  <!-- Layers sheet -->
  <section id="sheet-layers" class="sheet ui" hidden>
    <div class="sheet-head"><h2>Layers</h2><button class="icon-btn close" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <ul id="layer-list"></ul>
    <p id="layers-empty" class="muted">No references yet. Tap “Add reference” to pick images from your gallery.</p>
    <div id="layer-props" hidden>
      <label class="row">Opacity <input id="p-opacity" type="range" min="0" max="1" step="0.01"><output id="o-opacity"></output></label>
      <div class="row seg" id="p-mode" role="radiogroup" aria-label="Display mode">
        <button data-mode="0">Color</button><button data-mode="1">Gray</button><button data-mode="2">Edges</button>
      </div>
      <div id="edge-opts" hidden>
        <label class="row">Edge threshold <input id="p-threshold" type="range" min="0.02" max="1.2" step="0.01"><output id="o-threshold"></output></label>
        <div class="row swatches" id="p-edgecolor" aria-label="Edge colour">
          <button data-c="0,0,0" style="background:#000"></button>
          <button data-c="0.9,0.1,0.1" style="background:#e61a1a"></button>
          <button data-c="0.1,0.35,1" style="background:#1a59ff"></button>
          <button data-c="0.1,0.75,0.2" style="background:#1abf33"></button>
          <button data-c="1,1,1" style="background:#fff"></button>
        </div>
      </div>
      <div class="row buttons">
        <button id="p-flip"><svg><use href="#i-flip"/></svg>Flip</button>
        <button id="p-rot">Rotate 90°</button>
        <button id="p-fit">Reset size</button>
      </div>
    </div>
  </section>

  <!-- Settings sheet -->
  <section id="sheet-settings" class="sheet ui" hidden>
    <div class="sheet-head"><h2>Settings</h2><button class="icon-btn close" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <label class="row">Grid cells <input id="s-cells" type="range" min="2" max="24" step="1"><output id="o-cells"></output></label>
    <label class="row">Smoothing <input id="s-smooth" type="range" min="0" max="1" step="0.05"><output id="o-smooth"></output></label>
    <label class="row">Tracking resolution
      <select id="s-proc"><option value="480">480 px (fast)</option><option value="640">640 px (precise)</option></select>
    </label>
    <label class="row check"><input id="s-stats" type="checkbox"> Show performance stats</label>
    <label class="row check" id="torch-row" hidden><input id="s-torch" type="checkbox"> Flashlight</label>
    <div class="row buttons">
      <button id="s-recapture">Recapture canvas</button>
      <button id="s-clear" class="danger">Clear session</button>
    </div>
    <p class="muted small">Tracit runs entirely on your phone. Nothing is uploaded. <span id="version"></span></p>
  </section>

  <div id="hint" class="toast" hidden></div>
  <div id="tip" class="toast tip" hidden><span id="tip-text"></span><button class="icon-btn close" aria-label="Dismiss"><svg><use href="#i-close"/></svg></button></div>

  <div id="frozen" hidden>Frozen · tap to resume</div>

  <div id="loading" class="ui" hidden>
    <div>Loading tracking engine (OpenCV.js)…</div>
    <progress id="load-progress" max="1" value="0"></progress>
    <div id="load-text" class="muted small"></div>
  </div>

  <div id="error" class="modal" hidden>
    <div class="card">
      <h2 id="error-title">Camera unavailable</h2>
      <p id="error-text"></p>
      <div class="row buttons"><button id="error-retry" class="primary">Try again</button><button id="error-close">Close</button></div>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
